<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Intro</title>
    <link rel="stylesheet" href="gsap.css">
</head>

<body>
    <h1>GSAP Intro</h1>

    <section class="hero">
        <button type="button" id="replay">Replay timeline</button>
        <div class="stage">
            <div class="panel panel-1">Panel 1</div>
            <div class="panel panel-2">Panel 2</div>
            <div class="panel panel-3">Panel 3</div>
            <div class="badge">New</div>
        </div>
    </section>

    <div class="spacer">
        <p>Scroll down</p>
    </div>

    <section class="reveal">
        <h2>Reveal on enter</h2>
        <p>This section plays an animation when it enters the viewport.</p>
    </section>

    <section class="pin-section">
        <div class="step step-1">Step 1</div>
        <div class="step step-2">Step 2</div>
        <div class="step step-3">Step 3</div>
    </section>

    <section class="card-grid">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
    </section>

    <div class="spacer end-spacer"></div>

    <!-- >>> STEP 1 | PART 2: LOAD GSAP -->
    <!-- >>> ACTION: delete the opening and closing comment lines around the script tags below -->
    <!-- >>> Order matters: core, then plugin, then my script last -->

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="animation.js"></script>

</body>

</html>
