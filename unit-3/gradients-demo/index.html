<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Gradients</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Advanced Gradients</h1>

  <h2>1. Repeating gradient</h2>
  <div class="box stripes"></div>

  <h2>2. Gradient + background-size</h2>
  <div class="box h-stripes"></div>

  <h2>3. Patterns</h2>
  <div class="row">
    <div class="box pattern dots"></div>
    <div class="box pattern checkerboard"></div>
    <div class="box pattern grid-lines"></div>
  </div>

  <h2>4. Animated gradient</h2>
  <div class="hero shimmer">Hero Shimmer</div>
</body>
</html>
